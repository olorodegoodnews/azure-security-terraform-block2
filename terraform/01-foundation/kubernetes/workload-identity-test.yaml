apiVersion: v1
kind: Pod
metadata:
  name: workload-identity-test
  namespace: block2-app
  labels:
    azure.workload.identity/use: "true"
spec:
  serviceAccountName: block2-workload-sa

  containers:
    - name: azure-cli
      image: mcr.microsoft.com/azure-cli:2.90.0
      command:
        - /bin/sh
        - -c
        - sleep 3600

  restartPolicy: Never