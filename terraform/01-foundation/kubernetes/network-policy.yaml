apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-policy-target
  namespace: block2-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: network-policy-target
  template:
    metadata:
      labels:
        app: network-policy-target
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: network-policy-target
  namespace: block2-app
spec:
  type: ClusterIP
  selector:
    app: network-policy-target
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: v1
kind: Pod
metadata:
  name: allowed-client
  namespace: block2-app
  labels:
    access: allowed
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600

---
apiVersion: v1
kind: Pod
metadata:
  name: blocked-client
  namespace: block2-app
  labels:
    access: blocked
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: block2-app
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-approved-client
  namespace: block2-app
spec:
  podSelector:
    matchLabels:
      app: network-policy-target
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: allowed
      ports:
        - protocol: TCP
          port: 80