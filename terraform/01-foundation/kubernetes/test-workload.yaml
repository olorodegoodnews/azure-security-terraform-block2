apiVersion: apps/v1
kind: Deployment
metadata:
  name: block2-test-web
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: block2-test-web
  template:
    metadata:
      labels:
        app: block2-test-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: block2-test-web
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: block2-test-web
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP